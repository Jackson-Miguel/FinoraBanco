<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title id="txt_header"> Bem-vindo ao seu banco! </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-card id="cardLogin">
      <ion-card-header>
        <ion-card-title> Acesse sua conta </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-input
          label="CPF"
          label-placement="floating"
          fill="outline"
          placeholder="Digite sue CPF"
          [(ngModel)]="cpf"
          maxlength="11"
        ></ion-input>
        <br />
        <ion-input
          label="Email"
          type="email"
          label-placement="floating"
          fill="outline"
          placeholder="Digite sue Email"
          [(ngModel)]="email"
        ></ion-input>
        <br />
        <ion-button color="tertiary" (click)="login()">Entrar</ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
